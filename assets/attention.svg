<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"><rect width="900" height="620" fill="#fbfaf7"/><g font-family="Arial,sans-serif" fill="#1d1d1a"><text x="450" y="55" text-anchor="middle" font-size="28" font-weight="700">Causal self-attention</text><text x="450" y="88" text-anchor="middle" font-size="16" fill="#706f68">each token can use the past, but not the future</text></g><g stroke="#d7d2c8" stroke-width="1"><path d="M180 150h600M180 250h600M180 350h600M180 450h600M180 550h600"/><path d="M180 150v400M300 150v400M420 150v400M540 150v400M660 150v400M780 150v400"/></g><g fill="#dff5a0" stroke="#1d1d1a" stroke-width="2"><rect x="180" y="150" width="120" height="100"/><rect x="180" y="250" width="120" height="100"/><rect x="300" y="250" width="120" height="100"/><rect x="180" y="350" width="120" height="100"/><rect x="300" y="350" width="120" height="100"/><rect x="420" y="350" width="120" height="100"/><rect x="180" y="450" width="120" height="100"/><rect x="300" y="450" width="120" height="100"/><rect x="420" y="450" width="120" height="100"/><rect x="540" y="450" width="120" height="100"/></g><g font-family="Arial,sans-serif" font-size="16" fill="#706f68" text-anchor="middle"><text x="240" y="210">I</text><text x="240" y="310">like</text><text x="360" y="310">I</text><text x="240" y="410">small</text><text x="360" y="410">language</text><text x="480" y="410">models</text><text x="240" y="510">because</text><text x="360" y="510">they</text><text x="480" y="510">teach</text><text x="600" y="510">me</text></g><text x="450" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#706f68">Rows are the token asking a question; columns are the tokens it can read.</text></svg>